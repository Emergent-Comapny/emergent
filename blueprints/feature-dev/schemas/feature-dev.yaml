name: feature-dev
version: 1.0.0
description: >
  Lightweight feature development tracking for agent memory. Captures what
  the user asked for (Requirements as user stories), what was being built
  (Feature), and why decisions were made (Decision). Minimal but graph-
  traversable — 3 types, 4 relationships. Designed to be populated by
  agents during feature discussions and recalled in future sessions.

objectTypeSchemas:

  - name: Feature
    label: Feature
    description: >
      A feature being developed — the top-level entity that groups
      requirements, decisions, and implementation work. Created when
      the user describes a new feature request.
    properties:
      name:
        type: string
        required: true
        description: "Short feature name, e.g. 'dark-mode-toggle'"
      summary:
        type: string
        description: "One-line summary of what the feature does"
      description:
        type: string
        description: "Detailed description of the feature from discussion"
      status:
        type: string
        required: true
        enum:
          - proposed
          - in_progress
          - done
          - blocked
        default: proposed
        description: "Current development status"
      created_at:
        type: string
        description: "ISO 8601 timestamp of when feature was first discussed"
    labels:
      - feature
      - "{status}"
    ui:
      icon: "🎯"
      color: "#0891B2"

  - name: Requirement
    label: Requirement
    description: >
      A single requirement for a feature — user story, acceptance
      criterion, or constraint. Extracted from the user's description
      of what they want.
    properties:
      text:
        type: string
        required: true
        description: "The requirement text, e.g. 'As a user, I want a dark mode toggle'"
      kind:
        type: string
        required: true
        enum:
          - user_story
          - acceptance_criteria
          - constraint
          - nice_to_have
        default: user_story
        description: "Type of requirement"
      priority:
        type: string
        enum:
          - must
          - should
          - could
        default: should
        description: "Priority level"
      status:
        type: string
        enum:
          - open
          - done
          - deferred
        default: open
        description: "Whether this requirement is satisfied"
    labels:
      - requirement
      - "{kind}"
      - "{priority}"
    ui:
      icon: "📋"
      color: "#7C3AED"

  - name: Decision
    label: Decision
    description: >
      A technical or architectural decision made during feature
      development. Captures the rationale so future sessions
      understand why things were done a certain way.
    properties:
      title:
        type: string
        required: true
        description: "Short title, e.g. 'Use CSS variables for theming'"
      context:
        type: string
        description: "What problem or situation led to this decision"
      rationale:
        type: string
        description: "Why this option was chosen over alternatives"
      alternatives:
        type: string
        description: "Other options considered and why they were rejected"
      status:
        type: string
        enum:
          - proposed
          - accepted
          - deprecated
          - superseded
        default: accepted
        description: "Current status of the decision"
    labels:
      - decision
      - "{status}"
    ui:
      icon: "⚖️"
      color: "#DC2626"

relationshipTypeSchemas:

  - name: contains
    label: Contains
    description: >
      A Feature contains a Requirement. One feature has multiple
      requirements.
    sourceType: Feature
    targetType: Requirement

  - name: has_decision
    label: Has Decision
    description: >
      A Feature has a technical Decision. Links the what (feature)
      to the why (decision).
    sourceType: Feature
    targetType: Decision

  - name: implements
    label: Implements
    description: >
      A Feature is implemented in a SourceFile. Links to files
      from the code-structure schema that were modified for this
      feature.
    sourceType: Feature
    targetType: SourceFile
    properties:
      change_type:
        type: string
        enum:
          - created
          - modified
          - deleted
        description: "How the file was changed for this feature"

  - name: relates_to
    label: Relates To
    description: >
      A Decision is related to another Decision. Builds a web of
      connected technical choices.
    sourceType: Decision
    targetType: Decision
